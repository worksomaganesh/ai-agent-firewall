name: Security and Adversarial Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 full acceptance and Linux enforcement tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Bubblewrap build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build pkg-config libcap-dev
      - name: Build the patched upstream Bubblewrap release
        run: |
          git clone --depth 1 --branch v0.12.0 https://github.com/containers/bubblewrap.git "$RUNNER_TEMP/bubblewrap"
          meson setup "$RUNNER_TEMP/bubblewrap/build" "$RUNNER_TEMP/bubblewrap" --prefix=/usr/local
          meson compile -C "$RUNNER_TEMP/bubblewrap/build"
          sudo meson install -C "$RUNNER_TEMP/bubblewrap/build"
      - name: Enable user namespaces for this ephemeral runner when supported
        run: |
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then sudo sysctl -w kernel.unprivileged_userns_clone=1 || true; fi
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true; fi
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run acceptance, proxy, and Linux sandbox enforcement tests
        run: python -m pytest --cov=agent_boundary --cov-report=term-missing


  security-quality:
    name: Phase 4 static checks and package smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint Phase 4 security-critical modules and adversarial tests
        run: |
          python -m ruff check --select E4,E7,E9,F src tests
      - name: Type-check guarded action and workspace adapters
        run: |
          python -m mypy --follow-imports=silent src/agent_boundary/sandbox/guard.py src/agent_boundary/sandbox/workspace_tools.py
      - name: Verify import and CLI command surface
        run: |
          python -m compileall -q src tests
          agent-boundary --help
          agent-boundary --version
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python -m pip install twine
          python -m twine check dist/*

      - name: Install wheel in a clean virtual environment outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/agent-boundary" --version
          "$RUNNER_TEMP/wheel-venv/bin/python" -c "import agent_boundary; print(agent_boundary.__file__)"

      - name: Install source distribution in a second clean virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-venv/bin/agent-boundary" --version
          "$RUNNER_TEMP/sdist-venv/bin/python" -c "import agent_boundary; print(agent_boundary.__file__)"
