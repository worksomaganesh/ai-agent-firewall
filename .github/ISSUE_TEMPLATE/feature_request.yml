name: Feature request
description: Propose a capability or improvement with a clear use case.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement to agent-boundary.

        This project prioritizes clear trust boundaries, least privilege, fail-closed behavior, reproducible tests, and honest documentation. A smaller, well-tested capability is generally easier to review than a broad feature with unclear security guarantees.

        If your proposal reveals a current security vulnerability, do not describe the exploit publicly. Follow [SECURITY.md](https://github.com/worksomaganesh/ai-agent-firewall/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what limitation prevents it today?
      placeholder: Describe the user, workflow, and problem in practical terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature. Avoid prescribing a large implementation before the problem is understood.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you considered? Why are they insufficient?
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security and trust-boundary considerations
      description: Could this change widen filesystem access, network access, process capabilities, approval scope, or access to audit evidence? What should remain blocked?
      placeholder: Describe expected defaults, failure behavior, and risks, if known.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and tests that would indicate the feature is complete.
      placeholder: |
        - Given a defined setup, the CLI should...
        - Invalid or ambiguous input should...
        - Tests should verify...
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution interest
      description: This helps understand whether implementation support is available; it does not commit anyone to a deadline.
      options:
        - I may be able to implement this
        - I can help test or document it
        - I am proposing the idea only
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I searched the README and existing issues for related functionality.
          required: true
        - label: I described a concrete use case and expected result.
          required: true
        - label: I did not include credentials, private data, or details of an unresolved vulnerability.
          required: true
